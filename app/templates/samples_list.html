{% extends "base.html" %}
{% block content %}
<section class="card samples-workspace" data-samples-table>
  <div class="samples-toolbar">
    <label class="samples-search-field">
      <span class="muted">Search</span>
      <input
        type="search"
        id="samples-live-search"
        placeholder="Search ID, study, type, visit, timepoint, notes, location"
        autocomplete="off"
      />
    </label>
    <div class="samples-toolbar-actions">
      <button type="button" class="icon-button column-picker-button" id="samples-column-picker-button" title="Choose visible columns">
        Cols
      </button>
      <button type="button" class="ghost-button hidden" id="samples-analysis-toggle" hidden>Select</button>
      <div class="samples-analysis-actions hidden" id="samples-analysis-actions" hidden>
        <button type="button" class="ghost-button" id="samples-analysis-add">Add to selection</button>
        <button type="button" class="ghost-button" id="samples-analysis-remove">Remove from selection</button>
        <a class="button" href="/sample-actions" id="samples-analysis-start">Open actions workspace</a>
        <button type="button" class="ghost-button" id="samples-analysis-clear">Clear selection</button>
      </div>
      <a class="ghost-button" href="/samples/bulk">Bulk Add</a>
      <a class="button" href="/samples/new">Add Sample</a>
    </div>
  </div>

  <div class="samples-active-state">
    <div class="samples-filter-chips" id="samples-filter-chips"></div>
    <p class="muted samples-result-count" id="samples-result-count"></p>
  </div>

  <div class="sample-table-wrap">
    <table class="table sample-table" id="samples-live-table">
      <colgroup id="samples-live-colgroup"></colgroup>
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>

  <p class="form-error hidden" id="samples-table-error"></p>

  <div class="samples-filter-overlay hidden" id="samples-filter-overlay" hidden>
    <div class="samples-filter-window" id="samples-filter-window" role="dialog" aria-modal="true" aria-labelledby="samples-filter-title"></div>
  </div>
  <div class="samples-popover hidden" id="samples-column-picker" role="dialog" aria-modal="false" hidden></div>

  <script id="samples-table-bootstrap" type="application/json">{{ bootstrap | tojson }}</script>
</section>

<noscript>
  <section class="card compact">
    <p class="muted">This page now uses live table controls and requires JavaScript.</p>
  </section>
</noscript>
{% endblock %}

{% block scripts %}
  <script src="/static/sample-actions.js"></script>
  <script src="/static/samples-table.js"></script>
{% endblock %}
